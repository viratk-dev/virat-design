<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#101010; font-family:'Archivo','Inter','Segoe UI',sans-serif; color:#F6F5F1; }
  .post { width:1080px; height:1350px; position:relative; padding:80px 100px 70px;
          display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; font-family:'IBM Plex Mono','Space Mono',monospace;
         font-size:28px; letter-spacing:6px; color:#8A8578; text-transform:uppercase; }
  .kicker { font-family:'IBM Plex Mono','Space Mono',monospace; font-size:30px; letter-spacing:8px; color:#E85A2A;
            text-transform:uppercase; margin-top:64px; }
  h1 { font-size:100px; font-weight:800; letter-spacing:-3px; line-height:1.02; margin-top:24px; }
  h1 .acc { color:#E85A2A; }
  .sub { font-size:38px; color:#A39E93; margin-top:28px; line-height:1.5; max-width:820px; }
  .list { margin-top:44px; display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:28px; padding:19px 0; border-top:1px solid #2A2A2A; }
  .num { font-family:'IBM Plex Mono','Space Mono',monospace; font-size:30px; color:#8A8578; min-width:56px; }
  .name { font-size:40px; font-weight:800; letter-spacing:-1px; }
  .tag { margin-left:auto; font-family:'IBM Plex Mono','Space Mono',monospace; font-size:24px; letter-spacing:3px;
         color:#A39E93; text-transform:uppercase; background:#1A1A1A; border:1px solid #2A2A2A;
         padding:12px 26px; border-radius:999px; }
  .footer { margin-top:auto; display:flex; justify-content:space-between; align-items:center;
            font-family:'IBM Plex Mono','Space Mono',monospace; font-size:26px; letter-spacing:4px; color:#8A8578;
            text-transform:uppercase; }
</style></head><body>
<div class="post">
  <div class="top"><span>Iron Pulse Gym</span><span>2026</span></div>
  <div class="kicker">Train Harder</div>
  <h1>5 WORKOUTS<br/><span class="acc">THAT BUILD</span><br/>REAL STRENGTH</h1>
  <div class="sub">No machines. No excuses. Just iron and consistency.</div>
  <div class="list">
    <div class="row"><div class="num">01</div><div class="name">Deadlift</div><div class="tag">Back</div></div>
    <div class="row"><div class="num">02</div><div class="name">Squat</div><div class="tag">Legs</div></div>
    <div class="row"><div class="num">03</div><div class="name">Bench Press</div><div class="tag">Chest</div></div>
    <div class="row"><div class="num">04</div><div class="name">Pull-Up</div><div class="tag">Lats</div></div>
    <div class="row"><div class="num">05</div><div class="name">Overhead Press</div><div class="tag">Shoulders</div></div>
  </div>
  <div class="footer"><span>@ironpulse</span><span>Save →</span></div>
</div>
</body></html>
