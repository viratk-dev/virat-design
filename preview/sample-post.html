<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#F6F5F1; font-family:'Plus Jakarta Sans','Inter','Segoe UI',sans-serif; color:#151515; }
  .post { width:1080px; height:1350px; position:relative; padding:80px 100px 70px;
          display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; font-family:'Space Mono',monospace;
         font-size:28px; letter-spacing:6px; color:#8A8578; text-transform:uppercase; }
  .kicker { font-family:'Space Mono',monospace; font-size:30px; letter-spacing:8px; color:#334EE8;
            text-transform:uppercase; margin-top:64px; }
  h1 { font-size:132px; font-weight:800; letter-spacing:-3px; line-height:1.02; margin-top:24px; }
  h1 .blue { color:#334EE8; }
  .sub { font-size:38px; color:#6B675C; margin-top:28px; line-height:1.5; max-width:820px; }
  .list { margin-top:44px; display:flex; flex-direction:column; gap:0; }
  .row { display:flex; align-items:center; gap:28px; padding:19px 0; border-top:1px solid #E8E2D4; }
  .num { font-family:'Space Mono',monospace; font-size:30px; color:#8A8578; min-width:56px; }
  .name { font-size:40px; font-weight:800; letter-spacing:-1px; }
  .tag { margin-left:auto; font-family:'Space Mono',monospace; font-size:24px; letter-spacing:3px;
         color:#6B675C; text-transform:uppercase; background:#fff; border:1px solid #E8E2D4;
         padding:12px 26px; border-radius:999px; }
  .footer { margin-top:auto; display:flex; justify-content:space-between; align-items:center;
            font-family:'Space Mono',monospace; font-size:26px; letter-spacing:4px; color:#8A8578;
            text-transform:uppercase; }
</style></head><body>
<div class="post">
  <div class="top"><span>Student Essentials</span><span>2026</span></div>
  <div class="kicker">Study Smarter</div>
  <h1>5 AI TOOLS<br/><span class="blue">FOR STUDENTS</span></h1>
  <div class="sub">Free tools that actually save hours — notes, research, practice, revision.</div>
  <div class="list">
    <div class="row"><div class="num">01</div><div class="name">NotebookLM</div><div class="tag">Notes</div></div>
    <div class="row"><div class="num">02</div><div class="name">Perplexity</div><div class="tag">Research</div></div>
    <div class="row"><div class="num">03</div><div class="name">ChatGPT</div><div class="tag">Practice</div></div>
    <div class="row"><div class="num">04</div><div class="name">Notion AI</div><div class="tag">Organize</div></div>
    <div class="row"><div class="num">05</div><div class="name">Quillbot</div><div class="tag">Writing</div></div>
  </div>
  <div class="footer"><span>@virat.builds</span><span>Save →</span></div>
</div>
</body></html>
